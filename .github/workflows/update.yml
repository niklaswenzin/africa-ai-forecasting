# Haelt das Dashboard aktuell und baut die Historie auf.
#
# Zwei Takte, aus Kostengruenden getrennt:
#   - Marktdaten alle 6 Stunden. Die Quellen-APIs sind gratis.
#   - Prognosen einmal pro Woche. Jeder Lauf kostet echtes Geld bei zwei
#     Modellen mal 17 Fragen; viermal taeglich waere Verschwendung, weil sich
#     Prognosen zu Fragen mit Monaten Restlaufzeit kaum bewegen.
#
# Wichtig fuer die Historie: auch die reinen Marktlaeufe schreiben eine
# Aufnahme. So entsteht die Quotenzeitreihe, die der Brier Score spaeter
# braucht - ohne sie liesse sich der Markt nicht fair zum Prognosezeitpunkt
# messen.

name: Dashboard aktualisieren

on:
  schedule:
    # Marktdaten: 00, 06, 12, 18 Uhr UTC.
    - cron: "0 0,6,12,18 * * *"
    # Prognosen: montags 07:00 UTC. Bewusst NICHT zur vollen 6-Stunden-Marke,
    # sonst wuerden beide Zeitplaene gleichzeitig feuern und der Lauf liefe
    # doppelt.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mit_prognosen:
        description: "Auch Prognosen erzeugen (kostet API-Guthaben)"
        type: boolean
        default: false

# Zwei gleichzeitige Laeufe wuerden sich beim Commit in die Quere kommen.
concurrency:
  group: dashboard-update
  cancel-in-progress: false

permissions:
  contents: write        # noetig, damit der Lauf seine Ergebnisse zurueckschreibt

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Standard waere nur der letzte Commit. Das genuegt nicht: der
          # Schritt am Ende macht ein git pull --rebase, und das scheitert
          # auf einer flachen Kopie.
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Entscheidet einmal zentral, ob dieser Lauf Prognosen erzeugt: beim
      # Wochentermin oder wenn er von Hand mit gesetztem Haekchen gestartet
      # wurde. Als eigener Schritt, damit die Bedingung nur an einer Stelle
      # steht und nicht in jedem Schritt wiederholt werden muss.
      - name: Lauf-Art bestimmen
        id: art
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 1" ] \
             || [ "${{ inputs.mit_prognosen }}" = "true" ]; then
            echo "prognosen=true" >> "$GITHUB_OUTPUT"
            echo "Wochenlauf: Marktdaten UND Prognosen."
          else
            echo "prognosen=false" >> "$GITHUB_OUTPUT"
            echo "Marktlauf: nur Quoten, keine Prognosen."
          fi

      # Ab hier gilt durchgehend continue-on-error. Faellt eine Quelle oder
      # eine Modell-API aus, soll der Lauf den letzten guten Stand behalten
      # und die Seite trotzdem neu bauen - eine rote Action, die nichts
      # kaputtgemacht hat, waere nur ein Fehlalarm. Die Skripte selbst sind
      # darauf ausgelegt: sie ueberschreiben bei Ausfall keine guten Daten.
      - name: Marktdaten holen
        continue-on-error: true
        env:
          METACULUS_API_TOKEN: ${{ secrets.METACULUS_API_TOKEN }}
        run: python fetch_markets.py

      - name: Prognosen erzeugen
        if: steps.art.outputs.prognosen == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python forecast.py

      - name: Aufloesungen pruefen
        continue-on-error: true
        run: python resolve_questions.py

      - name: Aufnahme in die Historie schreiben
        continue-on-error: true
        run: python snapshot.py

      - name: Auswertung und Brier Score
        continue-on-error: true
        run: |
          python evaluate.py
          python brier.py

      # Der einzige Schritt, der scheitern DARF: geht das Bauen der Seite
      # schief, gibt es nichts zu committen und der Fehler soll sichtbar sein.
      - name: Seite bauen
        run: python build_site.py

      - name: Ergebnisse zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # --quiet liefert Exit 1, wenn es Aenderungen gibt. Ohne diese
          # Pruefung erzeugte jeder Lauf einen leeren Commit.
          if git diff --cached --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
          else
            git commit -m "Automatische Aktualisierung ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # Zwischen Checkout und Push koennen Minuten liegen; ein
            # zwischenzeitlicher Commit von Hand wuerde den Push sonst
            # ablehnen. rebase statt merge, damit die Historie linear bleibt.
            git pull --rebase origin main
            git push origin main
          fi
